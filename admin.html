<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>MAX SHOP Admin</title><link rel="stylesheet" href="/app.css"><script defer src="/api.js"></script><script defer src="/admin.js"></script></head><body><main class="wrap"><header class="top"><div><div class="brand">MAX SHOP</div><div class="muted">Admin console</div></div><nav class="nav"><a href="/">Home</a><a href="/generator.html">Generator</a><button id="logout" class="secondary">Sign out</button></nav></header><div id="notice" class="status hidden" role="status"></div><section class="card"><h2>Inventory</h2><div id="counts" class="grid"></div><label>Type</label><select id="stock-type"><option>discord</option><option>steam</option><option>rockstar</option><option value="rockstar_code">rockstar_code</option></select><label>One stock item per line</label><textarea id="stock-lines"></textarea><button id="add-stock">Add stock</button><button id="clear-stock" class="danger">Clear selected</button></section><section class="card"><h2>Create license</h2><div class="grid"><div class="field"><label>Label</label><input id="label"></div><div class="field"><label>Tier</label><select id="tier"><option>weekly</option><option>monthly</option><option>lifetime</option></select></div><div class="field"><label>Validity days</label><input id="days" type="number" min="1" max="3650" value="7"></div><div class="field"><label>Optional Discord ID</label><input id="discord-id" inputmode="numeric"></div></div><label><input id="rsc" type="checkbox"> Rockstar code access</label><p><button id="create-license">Create license</button></p><div id="new-token" class="status hidden"></div></section><section class="card"><h2>Licenses</h2><div id="licenses"></div></section><section class="card"><h2>Bug reports</h2><div id="bugs"></div></section><section class="card"><h2>Public messages</h2><label>Announcement</label><textarea id="announcement"></textarea><button id="save-announcement">Save announcement</button><label>Stock update</label><textarea id="stock-update"></textarea><button id="save-stock-update">Save stock update</button></section></main></body></html>
