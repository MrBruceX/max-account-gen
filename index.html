<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>MAX SHOP</title><link rel="stylesheet" href="/app.css"><script defer src="/api.js"></script><script defer src="/index.js"></script></head><body><main class="wrap"><header class="top"><div><div class="brand">MAX SHOP</div><div class="muted">Secure access</div></div><nav class="nav"><a href="/">Home</a><a href="/generator.html">Generator</a><a href="/admin.html">Admin</a></nav></header><div class="grid"><section class="card"><h2>Customer activation</h2><form id="activate"><div class="field"><label>License token</label><input id="token" required maxlength="128"></div><div class="field"><label>Discord user ID</label><input id="discord" required inputmode="numeric" pattern="[0-9]{15,20}" maxlength="20"></div><button>Activate</button></form></section><section class="card"><h2>Administrator login</h2><form id="login"><div class="field"><label>Email</label><input id="email" type="email" required maxlength="254" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required maxlength="128" autocomplete="current-password"></div><button>Sign in</button></form></section></div><section class="card"><h2>Shop status</h2><div id="summary" class="muted">Loading…</div><div id="msg" class="status hidden" role="status"></div></section></main></body></html>
